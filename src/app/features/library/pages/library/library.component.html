<div class="library">

  <h2>🎵 Bibliothèque musicale</h2>

  <!-- 🔍 Recherche -->
  <input
    type="text"
    placeholder="Rechercher par titre ou artiste"
    [(ngModel)]="searchTerm"
    class="search-input"
  />

  <!-- 🎼 Filtre catégorie -->
  <select [(ngModel)]="selectedCategory" class="filter-select">
    <option value="all">Toutes les catégories</option>
    <option value="pop">Pop</option>
    <option value="rock">Rock</option>
    <option value="rap">Rap</option>
    <option value="jazz">Jazz</option>
    <option value="classical">Classique</option>
    <option value="other">Autre</option>
  </select>

  <!-- ⏳ Chargement -->
  <!-- Simplified loading check -->
  
  <!-- ❌ Erreur -->
  <p class="error" *ngIf="error$ | async as error">
    {{ error }}
  </p>

  <!-- 📃 Liste -->
  <ng-container *ngIf="tracks$ | async as tracks">
    <ul *ngIf="tracks.length > 0">
      <li *ngFor="let track of filterTracks(tracks)">
        <strong>{{ track.title }}</strong> – {{ track.artist }}
        <span class="category">({{ track.category }})</span>

        <div class="actions">
          <a [routerLink]="['/track', track.id]">▶ Lire</a>
          <button (click)="editTrack(track)">📝 Modifier</button>
          <button (click)="deleteTrack(track.id)">🗑 Supprimer</button>
        </div>
      </li>
    </ul>

    <!-- 🚫 Aucun résultat -->
    <p *ngIf="tracks.length === 0">
      Aucun track dans la bibliothèque.
    </p>
  </ng-container>

</div>

<hr />

<h3 id="track-form-anchor">{{ isEditing ? '📝 Modifier le track' : '➕ Ajouter un track' }}</h3>

<form [formGroup]="trackForm" (ngSubmit)="submit()">

  <input formControlName="title" placeholder="Titre" />
  <small *ngIf="trackForm.get('title')?.touched && trackForm.get('title')?.invalid">
    Titre requis (max 50 caractères)
  </small>

  <input formControlName="artist" placeholder="Artiste" />
  <small *ngIf="trackForm.get('artist')?.touched && trackForm.get('artist')?.invalid">
    Artiste requis
  </small>

  <textarea
    formControlName="description"
    placeholder="Description (optionnelle)">
  </textarea>

  <select formControlName="category">
    <option value="pop">Pop</option>
    <option value="rock">Rock</option>
    <option value="rap">Rap</option>
    <option value="jazz">Jazz</option>
    <option value="classical">Classique</option>
    <option value="other">Autre</option>
  </select>

  <div *ngIf="!isEditing">
    <input type="file" (change)="onFileSelected($event)" />
    <p class="error" *ngIf="fileError">{{ fileError }}</p>
  </div>

  <div class="form-actions">
    <button type="submit" [disabled]="trackForm.invalid || fileError">
      {{ isEditing ? 'Mettre à jour' : 'Ajouter' }}
    </button>
    <button type="button" *ngIf="isEditing" (click)="cancelEdit()">
      Annuler
    </button>
  </div>

</form>
